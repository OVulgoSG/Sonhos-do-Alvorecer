<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonhos do Alvorecer — Ficha de Personagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
:root {
  --bg-void:#04070d; --bg-panel:#0f1c38; --bg-panel-alt:#152a4d; --border-soft:#2b3d63;
  --gold:#d4a942; --gold-bright:#f2ca6e; --text-main:#e9edf7; --text-muted:#93a3c9;
  --vida:#c0392b; --energia:#2fb8a6; --mental:#9370db; --danger:#f08a85;
  --radius-lg:16px; --radius-md:10px; --radius-sm:6px;
  --shadow-lg:0 14px 34px rgba(0,0,0,.5);
}
body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text-main);
  background:radial-gradient(ellipse 140% 90% at 50% 115%, #1c3155 0%, #0a1226 45%, #04070d 100%);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.hidden { display:none !important; }
.app-shell { max-width:880px; margin:0 auto; padding:28px 16px 72px; }
h1,h2,h3,h4 { font-family:'Cinzel',serif; font-weight:600; letter-spacing:.02em; margin:0 0 8px; }
.logo-title { font-family:'Pirata One',cursive; font-size:clamp(2rem,7vw,3.2rem); color:var(--gold-bright); text-align:center; text-shadow:0 0 26px rgba(212,169,66,.35); margin-bottom:18px; }
.mini-logo { font-family:'Pirata One',cursive; font-size:1.5rem; color:var(--gold-bright); text-align:center; margin-bottom:16px; opacity:.9; }
.loading-screen { text-align:center; padding:80px 16px; color:var(--text-muted); font-family:'Cinzel',serif; font-size:1.1rem; }

.progress-dots { display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--border-soft); transition:.2s; }
.dot.active { background:var(--gold-bright); box-shadow:0 0 8px var(--gold-bright); transform:scale(1.3); }
.dot.done { background:var(--gold); }

.wizard-card { background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:28px 24px; box-shadow:var(--shadow-lg); }
.step-title { color:var(--gold-bright); font-size:1.4rem; }
.step-sub { color:var(--text-muted); margin-bottom:20px; font-size:.92rem; }
.step-body { display:flex; flex-direction:column; gap:16px; }
.welcome-text { color:var(--text-muted); text-align:center; line-height:1.7; padding:12px 0 4px; }
.wizard-nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }

.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:.85rem; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.field-row { display:flex; gap:14px; }
.field-row .field { flex:1; }
input[type="text"], input[type="number"], select, textarea {
  background:var(--bg-void); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  color:var(--text-main); padding:9px 11px; font-family:inherit; font-size:.95rem; width:100%;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,169,66,.18); }
textarea { resize:vertical; line-height:1.6; }

.btn { font-family:'Cinzel',serif; font-size:.9rem; font-weight:600; padding:10px 20px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid transparent; transition:.15s; }
.btn-primary { background:linear-gradient(135deg,var(--gold-bright),var(--gold)); color:#1a1206; }
.btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
.btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; filter:none; }
.btn-ghost { background:transparent; border-color:var(--border-soft); color:var(--text-main); }
.btn-ghost:hover { border-color:var(--gold); color:var(--gold-bright); }
.btn-link { background:none; border:none; color:var(--text-muted); text-decoration:underline; cursor:pointer; font-size:.85rem; }
.btn-link:hover { color:var(--danger); }

.info-icon { position:relative; cursor:help; color:var(--gold); font-size:.85em; }
.info-icon::after {
  content:attr(data-tooltip); position:absolute; bottom:135%; left:50%; transform:translateX(-50%);
  background:#0a1630; border:1px solid var(--gold); padding:8px 11px; border-radius:var(--radius-sm);
  font-size:.78rem; width:max-content; max-width:230px; white-space:normal; color:var(--text-main);
  opacity:0; pointer-events:none; transition:opacity .15s; z-index:60; line-height:1.4;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.info-icon:hover::after, .info-icon:focus::after, .info-icon.show::after { opacity:1; }

.warning-text { color:var(--danger); font-size:.82rem; }
.hint-text { color:var(--text-muted); font-size:.78rem; min-height:1em; }

.attr-grid { display:flex; flex-direction:column; gap:4px; }
.attr-row { display:grid; grid-template-columns:1fr 64px 78px; gap:8px; align-items:center; }
.attr-head { color:var(--text-muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; padding-bottom:4px; border-bottom:1px solid var(--border-soft); margin-bottom:4px; }
.attr-label { font-size:.9rem; display:flex; align-items:center; gap:5px; }
.attr-row input { padding:6px 7px; text-align:center; }
.attr-columns { display:grid; grid-template-columns:1fr 1fr; gap:24px; }

.switch-row { display:flex; align-items:center; gap:10px; cursor:pointer; font-size:.95rem; }
.switch-row.small { font-size:.85rem; }
.switch-row input[type="checkbox"] { width:18px; height:18px; accent-color:var(--gold); cursor:pointer; }
.haki-toggle { padding:10px 0; border-bottom:1px solid var(--border-soft); }
.haki-toggle:last-child { border-bottom:none; }
.sub-toggle { display:flex; align-items:center; gap:8px; margin:8px 0 2px 28px; font-size:.9rem; color:var(--text-soft); }
.sub-toggle input:disabled + span, .sub-toggle.locked span { opacity:.42; color:var(--text-muted); }
.sub-toggle.locked { opacity:.55; cursor:not-allowed; }
.sub-toggle.locked input { opacity:.45; cursor:not-allowed; }
.sub-toggle.locked label, .sub-toggle.locked span { cursor:not-allowed; }

.fruta-block { padding:10px 0; border-bottom:1px solid var(--border-soft); }
.fruta-block:last-child { border-bottom:none; }
.fruta-details { display:none; gap:10px; margin-top:10px; flex-wrap:wrap; }
.fruta-block.active .fruta-details { display:flex; }
.fruta-details input, .fruta-details select { flex:1; min-width:120px; }

.panel { background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:20px; margin-bottom:18px; box-shadow:var(--shadow-lg); }
.panel h3 { color:var(--gold-bright); font-size:1.05rem; margin-bottom:14px; }

.sheet-header { display:flex; gap:18px; background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px; margin-bottom:16px; box-shadow:var(--shadow-lg); }
.portrait { width:96px; height:96px; border-radius:50%; border:2px solid var(--gold); background:var(--bg-void); flex-shrink:0; cursor:pointer; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.portrait img { width:100%; height:100%; object-fit:cover; }
.portrait-placeholder { font-size:.65rem; color:var(--text-muted); text-align:center; line-height:1.3; }
.identity-block { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
.identity-name { font-family:'Cinzel',serif; font-size:1.2rem; font-weight:600; background:transparent; border:none; border-bottom:1px solid var(--border-soft); border-radius:0; padding:4px 2px; }
.identity-player { font-size:.85rem; color:var(--text-muted); background:transparent; border:none; border-bottom:1px solid transparent; padding:2px; }
.identity-mini-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin-top:6px; }
.mini-field { display:flex; flex-direction:column; gap:2px; }
.mini-field.wide { grid-column:span 2; }
.mini-field label { font-size:.66rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.mini-field input { padding:5px 8px; font-size:.85rem; }

.tab-bar { display:flex; gap:4px; overflow-x:auto; margin-bottom:16px; border-bottom:1px solid var(--border-soft); }
.tab-btn { background:none; border:none; color:var(--text-muted); font-family:'Cinzel',serif; font-size:.85rem; padding:10px 16px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
.tab-btn.active { color:var(--gold-bright); border-bottom-color:var(--gold-bright); }
.tab-btn:hover { color:var(--text-main); }

.resource-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.resource-card { background:var(--bg-panel-alt); border-radius:var(--radius-md); padding:14px; border-top:3px solid var(--border-soft); }
.resource-vida { border-top-color:var(--vida); }
.resource-energia { border-top-color:var(--energia); }
.resource-mental { border-top-color:var(--mental); }
.resource-title { font-size:.88rem; font-weight:600; margin-bottom:8px; }
.resource-bar { height:8px; background:var(--bg-void); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.resource-bar-fill { height:100%; width:0%; transition:width .3s ease; }
.resource-vida .resource-bar-fill { background:linear-gradient(90deg,#7a1c1c,var(--vida)); }
.resource-energia .resource-bar-fill { background:linear-gradient(90deg,#186f64,var(--energia)); }
.resource-mental .resource-bar-fill { background:linear-gradient(90deg,#5c449e,var(--mental)); }
.resource-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.resource-fields label { font-size:.66rem; color:var(--text-muted); display:flex; flex-direction:column; gap:3px; }
.resource-fields input { padding:5px 6px; font-size:.85rem; }
.chip { display:inline-block; background:var(--bg-void); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:5px 6px; font-size:.85rem; text-align:center; }

.limite-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft); }
.limite-row:last-child { border-bottom:none; }
.limite-label { font-size:.9rem; }
.limite-pips { display:flex; gap:6px; }
.pip { width:34px; height:34px; border-radius:50%; border:1px solid var(--border-soft); background:var(--bg-void); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; opacity:.4; transition:.15s; }
.pip.active { opacity:1; border-color:var(--danger); background:rgba(240,138,133,.15); transform:scale(1.05); }

.foco-iniciativa-panel { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.foco-pips { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.foco-pip { width:32px; height:32px; border-radius:50%; border:1px solid var(--border-soft); background:var(--bg-void); cursor:pointer; opacity:.4; font-size:1rem; }
.foco-pip.active { opacity:1; border-color:var(--gold); background:rgba(212,169,66,.18); }
.formula-note { font-size:.75rem; color:var(--text-muted); margin-bottom:8px; }
.iniciativa-mod { font-family:'Cinzel',serif; font-size:1.8rem; color:var(--gold-bright); margin-bottom:10px; }
.iniciativa-resultado { margin-top:10px; font-size:.95rem; min-height:1.2em; }
@keyframes pulseAnim { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
.pulse { animation:pulseAnim .3s ease; display:inline-block; }

.item-row { display:grid; grid-template-columns:1fr 60px 1.4fr 32px; gap:8px; margin-bottom:8px; align-items:center; }
.item-remove { background:none; border:1px solid var(--border-soft); color:var(--danger); border-radius:var(--radius-sm); cursor:pointer; height:36px; }
.item-remove:hover { border-color:var(--danger); }
.empty-hint { color:var(--text-muted); font-size:.88rem; font-style:italic; }

.sheet-footer { text-align:center; margin-top:8px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.iniciativa-bonus-field { display:flex; flex-direction:column; gap:3px; font-size:.75rem; color:var(--text-muted); margin-bottom:10px; }
.iniciativa-bonus-field input { width:80px; }
.modal-overlay { position:fixed; inset:0; background:rgba(4,7,13,.75); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; }
.modal-box { background:var(--bg-panel); border:1px solid var(--gold); border-radius:var(--radius-lg); padding:22px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
.modal-field { display:flex; flex-direction:column; gap:4px; font-size:.75rem; color:var(--text-muted); }
.modal-field input { padding:6px 8px; }
.modal-actions { display:flex; justify-content:space-between; gap:10px; margin-top:10px; }

@media (max-width:640px) {
  .attr-columns { grid-template-columns:1fr; gap:18px; }
  .resource-cards { grid-template-columns:1fr; }
  .foco-iniciativa-panel { grid-template-columns:1fr; }
  .sheet-header { flex-direction:column; align-items:center; text-align:center; }
  .item-row { grid-template-columns:1fr; }
  .portrait { width:80px; height:80px; }
}
@media print {
  .wizard-nav, .tab-bar, .sheet-footer, .info-icon, #btnRolarIniciativa, .item-remove, #addItemBtn { display:none !important; }
  body { background:#fff; color:#000; }
  .panel, .resource-card, .sheet-header, .wizard-card { border:1px solid #ccc; box-shadow:none; background:#fff; }
}

<script>
/* ===== Configuração ===== */
const STORAGE_KEY = 'personagem';
const LOREM_IPSUM = "Lorem ipsum";
const PROFISSAO_OPCOES = ['Artista','Médico','Cozinheiro','Navegador & Piloto','Cientista & Engenheiro','Historiador','Diplomata','Ladrão & Espião','Combatente (não tem Profissão)'];
function profissaoOptionsHtml(){
  return PROFISSAO_OPCOES.map(o=>`<option value="${o}">${o.replace(/&/g,'&amp;')}</option>`).join('');
}
function defaultFormulaConfig(){
  return {
    vidaBase:25, vidaVigor:10, vidaForca:5, vidaCombate:2, vidaVontade:1,
    energiaBase:10, energiaVontade:1, energiaCombate:3, energiaPoder:10, energiaVigor:2, energiaRaciocinio:1,
    mentalBase:50, mentalVontade:20, mentalRaciocinio:5, mentalPoder:1, mentalPercepcao:1,
    iniciativaCombateDiv:2,
    vidaMultiplicador:1, energiaMultiplicador:1, mentalMultiplicador:1,
    vidaAjuste:0, energiaAjuste:0, mentalAjuste:0
  };
}
const FORMULA_FIELD_META = [
  ['vidaBase','Vida — base'], ['vidaVigor','Vida — × Vigor'], ['vidaForca','Vida — × Força'], ['vidaCombate','Vida — × Combate'], ['vidaVontade','Vida — × Vontade'],
  ['energiaBase','Energia — base'], ['energiaVontade','Energia — × Vontade'], ['energiaCombate','Energia — × Combate'], ['energiaPoder','Energia — × Poder'], ['energiaVigor','Energia — × Vigor'], ['energiaRaciocinio','Energia — − × Raciocínio'],
  ['mentalBase','Mente — base'], ['mentalVontade','Mente — × Vontade'], ['mentalRaciocinio','Mente — − × Raciocínio'], ['mentalPoder','Mente — × Poder'], ['mentalPercepcao','Mente — − × Percepção'],

function total(key) { const a = state.attrs[key]; return (Number(a.valor)||0) + (Number(a.mod)||0); }
function totals() { const t={}; Object.keys(ATTR_META).forEach(k=>t[k]=total(k)); return t; }
function computeVida(t){ const c=state.formulaConfig; return (c.vidaBase + t.vigor*c.vidaVigor + t.forca*c.vidaForca + t.combate*c.vidaCombate + t.vontade*c.vidaVontade) * (Number(c.vidaMultiplicador)||1) + (Number(c.vidaAjuste)||0); }
function computeEnergia(t){ const c=state.formulaConfig; return (c.energiaBase + t.vontade*c.energiaVontade + t.combate*c.energiaCombate + t.poder*c.energiaPoder + t.vigor*c.energiaVigor - t.raciocinio*c.energiaRaciocinio) * (Number(c.energiaMultiplicador)||1) + (Number(c.energiaAjuste)||0); }
function computeMente(t){ const c=state.formulaConfig; return Math.ceil((c.mentalBase + t.vontade*c.mentalVontade - t.raciocinio*c.mentalRaciocinio + t.poder*c.mentalPoder - t.percepcao*c.mentalPercepcao) * (Number(c.mentalMultiplicador)||1) + (Number(c.mentalAjuste)||0)); }
function computeIniciativa(t){ const c=state.formulaConfig; return t.rapidez + t.percepcao + Math.floor(t.combate/c.iniciativaCombateDiv) + (Number(state.iniciativaBonus)||0); }
function frutaBonusVidaPercent(){
  let pct=0;
  state.frutas.forEach(f=>{
    if(!f.possui) return;
    if (f.tipo==='Zoan') pct += f.despertada?0.75:0.50;
    else if (f.tipo==='Zoan Mítica' || f.tipo==='Zoan (Ancestral/Primordial)') pct += f.despertada?1.00:0.75;
  });
  return pct;
}
function frutaBonusEnergiaPercent(){
  let pct=0;
  state.frutas.forEach(f=>{
    if(!f.possui) return;
    if (f.tipo==='Logia') pct += f.despertada?0.50:0.25;
  });
  return pct;
}
function computeVidaFinal(t){ return Math.ceil(computeVida(t) * (1+frutaBonusVidaPercent())); }
function computeEnergiaFinal(t){ return Math.ceil(computeEnergia(t) * (1+frutaBonusEnergiaPercent())); }

function mergeState(loaded) {
  const base = defaultState();
  const merged = Object.assign({}, base, loaded || {});
  merged.identidade = Object.assign({}, base.identidade, loaded?.identidade||{});
  merged.attrs = {};
  Object.keys(base.attrs).forEach(k=>{
    merged.attrs[k] = Object.assign({}, base.attrs[k], (loaded?.attrs&&loaded.attrs[k])||{});
    if(Number(merged.attrs[k].valor) < 0) merged.attrs[k].valor = 0;
  });
  merged.haki = Object.assign({}, base.haki, loaded?.haki||{});
  // Haki avançado nunca pode existir sem o Haki normal correspondente.
  if(!merged.haki.observacao) merged.haki.observacaoAvancada=false;
  if(!merged.haki.armamento) merged.haki.armamentoAvancado=false;
  if(!merged.haki.conquistador) merged.haki.conquistadorAvancado=false;
  merged.frutas = base.frutas.map((f,i)=> Object.assign({}, f, (loaded?.frutas&&loaded.frutas[i])||{}));
  merged.recursos = {
    vida:Object.assign({},base.recursos.vida,loaded?.recursos?.vida||{}),
    energia:Object.assign({},base.recursos.energia,loaded?.recursos?.energia||{}),
    mental:Object.assign({},base.recursos.mental,loaded?.recursos?.mental||{})
  };
  merged.limites=Object.assign({},base.limites,loaded?.limites||{});
  merged.foco=Object.assign({},base.foco,loaded?.foco||{});
  merged.formulaConfig=Object.assign({},base.formulaConfig,loaded?.formulaConfig||{});
  merged.lobby=Object.assign(
  {},
  base.lobby,
  loaded?.lobby||{}
);
  merged.itens=loaded?.itens||[];
  merged.capangas=Array.isArray(loaded?.capangas) ? loaded.capangas.map(c=>({id:c.id||crypto.randomUUID?.()||String(Date.now()+Math.random()),nome:String(c.nome||'Capangas'),vida:Math.max(0,Number(c.vida)||0),energia:Math.max(0,Number(c.energia)||0),quantidade:Math.max(1,Number(c.quantidade)||1)})) : [];
  return merged;
}

async function loadState(){
  // Sem ?ficha=... estamos na página inicial: nunca recuperar a ficha anterior.
  if(!characterId){
    state = defaultState();
    try{
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('sonhos_ficha_id');
      localStorage.removeItem('sonhos_ficha_token');
    }catch(e){}
  }
  if(!ONLINE_ENABLED){
    return;
  }
  try{
    if(!window.supabase) throw new Error('Biblioteca Supabase não carregada.');
    supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY, LOBBY_ADMIN_TOKEN ? {global:{headers:{'x-lobby-admin-token':LOBBY_ADMIN_TOKEN}}} : undefined);
    if(characterId){
      const {data,error}=await supabaseClient.rpc('get_character_state',{p_id:characterId});
      if(error) throw error;
      localStorage.setItem('sonhos_ficha_id',characterId);
      state=mergeState(data);
      subscribeRealtime();
    }
  }catch(e){ console.warn('Modo online indisponível:',e); }
}
function scheduleSave(){
  clearTimeout(saveTimer); clearTimeout(onlineSaveTimer);
  saveTimer=setTimeout(saveState,350);
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch(e){}
  if(!ONLINE_ENABLED || !supabaseClient || !characterId || (!editToken && !IS_MASTER_SHEET)) return;
  clearTimeout(onlineSaveTimer);
  localSaveInFlight=true;
  onlineSaveTimer=setTimeout(async()=>{
    try{
      if(IS_MASTER_SHEET) await supabaseClient.rpc('update_character_by_admin',{p_id:characterId,p_state:state});
      else await supabaseClient.rpc('update_character_by_token',{p_id:characterId,p_token:editToken,p_state:state});
    }
    catch(e){ console.warn('Falha ao sincronizar:',e); }
    finally{ setTimeout(()=>{ localSaveInFlight=false; applyPendingRemoteState(); },250); }
  },150);
}
function subscribeRealtime(){
  if(!supabaseClient || !characterId) return;
  if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=supabaseClient.channel('character-'+characterId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'characters',filter:'id=eq.'+characterId},payload=>{
      if(!payload.new?.state) return;
      const incoming=payload.new.state;
      if(stateSignature(incoming)===stateSignature(state)) return;
      if(localSaveInFlight || sheetIsBusy()){ pendingRemoteState=incoming; return; }
      const currentTab=state.activeTab||'base';
      state=mergeState(incoming);
      state.activeTab=currentTab;
      if(state.wizardDone) refreshCurrentSheetTab(); else renderWizard();
    }).subscribe();
}

function buildAttrStep(group){
  const items = Object.entries(ATTR_META).filter(([k,v])=>v.group===group);
  const rows = items.map(([k,v])=>`
    <div class="attr-row" data-attr="${k}">
      <div class="attr-label">${v.label}${v.tip?infoIcon(v.tip):''}</div>
      <input type="number" class="attr-valor" data-attr="${k}" min="0">
      <input type="number" class="attr-mod" data-attr="${k}">
    </div>`).join('');
  return `
    <div class="attr-grid">
      <div class="attr-row attr-head"><div>Atributo</div><div>Valor</div><div>Mod.</div></div>
      ${rows}
    </div>
    <p class="hint-text">Modificador é um ajuste (+ ou −) somado ao Valor — a soma dos dois é usada nos cálculos.</p>`;
}
function fillAttrStep(group){
  Object.entries(ATTR_META).filter(([k,v])=>v.group===group).forEach(([k])=>{
    document.querySelector(`.attr-valor[data-attr="${k}"]`).value = state.attrs[k].valor;
    document.querySelector(`.attr-mod[data-attr="${k}"]`).value = state.attrs[k].mod;
  });
}
function bindAttrStep(){
  document.querySelectorAll('.attr-valor, .attr-mod').forEach(inp=>{
    inp.addEventListener('input', e=>{

      state.attrs[key][field] = field === 'valor' ? Math.max(0, Number(e.target.value)||0) : (Number(e.target.value)||0);
      scheduleSave();
    });
  });
}

function syncHakiDependencies(){
  const pairs=[
    ['Observacao','observacao','observacaoAvancada'],
    ['Armamento','armamento','armamentoAvancado'],
    ['Conquistador','conquistador','conquistadorAvancado']
  ];

  pairs.forEach(([name, normalKey, advancedKey])=>{
    // O estado é a fonte de verdade. Se o normal não estiver marcado,
    // o avançado SEMPRE é removido do estado.
    if(state.haki[normalKey] !== true){
      state.haki[normalKey]=false;
      state.haki[advancedKey]=false;
    }

    ['', 'p'].forEach(prefix=>{
      const normal=document.getElementById(prefix+'Chk'+name);
      const adv=document.getElementById(prefix+'Chk'+name+'Avancada');
      if(!normal || !adv) return;

      const unlocked=state.haki[normalKey] === true;
      normal.checked=unlocked;
      adv.disabled=!unlocked;
      adv.checked=unlocked && state.haki[advancedKey] === true;
      adv.setAttribute('aria-disabled', unlocked ? 'false' : 'true');
      adv.title=unlocked ? 'Haki Avançado liberado' : 'Marque o Haki normal primeiro';

      const row=adv.closest('.sub-toggle');
      if(row){
        row.classList.toggle('locked', !unlocked);
        row.setAttribute('aria-disabled', unlocked ? 'false' : 'true');
        row.style.opacity=unlocked ? '1' : '0.45';
        row.style.filter=unlocked ? 'none' : 'grayscale(1)';
        row.style.cursor=unlocked ? '' : 'not-allowed';
        const span=row.querySelector('span');
        if(span){
          span.style.opacity=unlocked ? '1' : '0.42';
          span.style.color=unlocked ? '' : '#888';
        }
      }
    });
  });
}

function bindHakiControls(){
  const pairs=[
    ['Observacao','observacao','observacaoAvancada'],
    ['Armamento','armamento','armamentoAvancada'],
    ['Conquistador','conquistador','conquistadorAvancada']
  ];
  // Corrige a chave digitada acima sem depender de nomes diferentes.
  pairs[1][2]='armamentoAvancado';
  pairs[2][2]='conquistadorAvancado';

  ['', 'p'].forEach(prefix=>{
    pairs.forEach(([name,normalKey,advancedKey])=>{
      const normal=document.getElementById(prefix+'Chk'+name);
      const adv=document.getElementById(prefix+'Chk'+name+'Avancada');
      if(!normal || !adv) return;

      normal.addEventListener('change',()=>{
        state.haki[normalKey]=normal.checked===true;
        if(!state.haki[normalKey]) state.haki[advancedKey]=false;
        syncHakiDependencies();
        scheduleSave();
      });

      adv.addEventListener('change',()=>{
        // Mesmo que algum navegador/label tente disparar o evento,
        // nunca permita avançado sem o normal.
        if(!state.haki[normalKey]){
          state.haki[advancedKey]=false;
        }else{
          state.haki[advancedKey]=adv.checked===true;
        }
        syncHakiDependencies();
        scheduleSave();
      });

      adv.addEventListener('click',e=>{
        if(!state.haki[normalKey]){
          e.preventDefault();
          e.stopPropagation();
          state.haki[advancedKey]=false;
          syncHakiDependencies();
        }
      });
    });
  });

  syncHakiDependencies();
}

function bindHakiStep(){ bindHakiControls(); }

function updateHakiHints(prefix){
  const t=totals();
  const items=[
    ['Observacao', t.percepcao>=1, `Percepção atual: ${t.percepcao} (precisa de ao menos 1)`],
    ['Armamento', t.poder>=1, `Poder atual: ${t.poder} (precisa de ao menos 1)`],
    ['Conquistador', (t.carisma>=1 && t.vontade>=2), `Precisa de Carisma ≥ 1 e Vontade ≥ 2 (atual: Carisma ${t.carisma}, Vontade ${t.vontade})`]
  ];
  items.forEach(([name,ok,msg])=>{
    const el=document.getElementById(prefix+'Hint'+name);
    if (el) el.textContent = ok ? '' : ('⚠️ '+msg);
  });
}

function buildDots(idx){
  const totalSteps = STEP_DEFS.length-1; let dots='';
  for(let i=1;i<=totalSteps;i++) dots += `<span class="dot ${i===idx?'active':''} ${i<idx?'done':''}"></span>`;
  return `<div class="progress-dots">${dots}</div>`;
}

function fillAndBindStep(key){
  switch(key){
    case 'id1': fillId1(); bindId1(); break;
    case 'id2': fillId2(); bindId2(); break;
    case 'id3': fillId3(); bindId3(); break;
    case 'fisico': fillAttrStep('fisico'); bindAttrStep(); break;
    case 'mental': fillAttrStep('mental'); bindAttrStep(); break;
    case 'haki': fillHakiStep(); bindHakiStep(); break;
    case 'frutas': fillFrutasStep(); bindFrutasStep(); break;
  }
  if (key==='welcome') {
    const btn=document.getElementById('btnImportWelcome');
    const inp=document.getElementById('importFileInputWelcome');
    if (btn && inp) { btn.onclick=()=>inp.click(); inp.addEventListener('change', importBackupFile); }
  }
  initTooltipTaps();
}

function renderWizard(){
  const app=document.getElementById('app');
  const idx=state.wizardStep; const def=STEP_DEFS[idx];
  let bodyHtml='';
  switch(def.key){
    case 'welcome': bodyHtml=buildWelcome(); break;
    case 'id1': bodyHtml=buildId1(); break;
    case 'id2': bodyHtml=buildId2(); break;
    case 'id3': bodyHtml=buildId3(); break;
    case 'fisico': bodyHtml=buildAttrStep('fisico'); break;
    case 'mental': bodyHtml=buildAttrStep('mental'); break;
    case 'haki': bodyHtml=buildHakiStep(); break;
    case 'frutas': bodyHtml=buildFrutasStep(); break;
  }
  const showDots = def.key!=='welcome';
  app.innerHTML = `
    <div class="app-shell">
      <div class="logo-title">Sonhos do Alvorecer</div>
      ${showDots?buildDots(idx):''}
      <div class="wizard-card">
        ${def.title?`<h2 class="step-title">${def.title}</h2>`:''}
        ${def.sub?`<p class="step-sub">${def.sub}</p>`:''}
        <div class="step-body">${bodyHtml}</div>
      </div>
      <div class="wizard-nav">
        ${idx>0?'<button id="btnBack" type="button" class="btn btn-ghost">← Voltar</button>':'<span></span>'}
        ${def.key==='welcome' ? '<button id="btnStart" type="button" class="btn btn-primary">Continuar ⚓</button>' :
          def.key==='frutas' ? '<button id="btnFinish" type="button" class="btn btn-primary">Finalizar Ficha ⚓</button>' :
          '<button id="btnNext" type="button" class="btn btn-primary">Avançar →</button>'}
      </div>
    </div>`;
  fillAndBindStep(def.key);
  wireNav(idx, def.key);
  bindSecretTrigger(document.querySelector('.logo-title'));
}
function wireNav(idx, key){
  const go=(target)=>{
    clearTimeout(saveTimer); clearTimeout(onlineSaveTimer);
    saveState();
    state.wizardStep=target;
    renderWizard();
  };
  const back=document.getElementById('btnBack'); if(back) back.onclick=()=>go(idx-1);
  const start=document.getElementById('btnStart'); if(start) start.onclick=()=>go(idx+1);
  const next=document.getElementById('btnNext'); if(next) next.onclick=()=>{
    // As regras do jogador são verificadas no PRIMEIRO Avançar,
    // logo depois de preencher o nome do jogador (tela id1).
    if(key==='id1'){
      const rule=getPlayerRule();
      if(rule.mensagem){
        showPlayerRule();
        if(rule.bloqueado) return;
        setTimeout(()=>go(idx+1),3000);
        return;
      }
    }
    // Para Vin/Eduard, a idade ainda não existe na primeira tela.
    // A mensagem já aparece no primeiro Avançar; a restrição de idade
    // é aplicada quando a idade passa a estar disponível.
    if(key==='id2'){
      const rule=getPlayerRule();
      if(rule.bloqueado){
        showPlayerRule();
        return;
      }
    }
    go(idx+1);
  };
  const finish=document.getElementById('btnFinish'); if(finish) finish.onclick=finalizeCharacter;
}
async function finalizeCharacter(){
  const t=totals();

  state.recursos.vida.atual=computeVidaFinal(t);
  state.recursos.energia.atual=computeEnergiaFinal(t);
  state.recursos.mental.atual=computeMente(t);
  state.wizardDone=true;

  if(ONLINE_ENABLED && !characterId){
    try{
      ensureSupabaseClient();
      await createOnlineCharacter();
    }catch(e){
      console.error('Não foi possível criar/configurar a ficha online:',e);
      alert('A ficha foi finalizada, mas ocorreu um erro ao criar ou configurar a ficha online. Você ainda pode usar o botão "🔐 Senha de edição" para definir a senha.');
    }
  }

  scheduleSave();
  renderSheet();
  if(ONLINE_ENABLED && characterId) addOnlineControls();
}

const CAPANGAS_STORAGE_KEY='sonhos_capangas_mestre';
function loadMasterCapangas(){
  try{
    const raw=localStorage.getItem(CAPANGAS_STORAGE_KEY);
    const parsed=JSON.parse(raw||'[]');
    return typeof normalizeLobbyCapangas==='function' ? normalizeLobbyCapangas(parsed) : (Array.isArray(parsed) ? parsed : []);
  }catch(e){ return []; }
}
function saveMasterCapangas(){
  try{ localStorage.setItem(CAPANGAS_STORAGE_KEY,JSON.stringify(typeof normalizeLobbyCapangas==='function' ? normalizeLobbyCapangas(state.capangas||[]) : (state.capangas||[]))); }catch(e){}
}

function buildCapangaRow(c){
  return `<div class="capanga-row" data-capanga-id="${escapeHtml(c.id)}">
    <div class="capanga-name"><strong>${escapeHtml(c.nome||'Capangas')}</strong></div>

  </div>`;
}
function renderCapangasPanel(){
  const list=document.getElementById('capangasList'); if(!list) return;
  list.innerHTML=(state.capangas||[]).length ? state.capangas.map(buildCapangaRow).join('') : '<div class="empty-hint">Nenhum grupo de capangas adicionado.</div>';
  list.querySelectorAll('[data-remove-capanga]').forEach(btn=>btn.onclick=()=>{
    state.capangas=state.capangas.filter(c=>c.id!==btn.dataset.removeCapanga);
    saveMasterCapangas(); renderCapangasPanel();
  });
}
function bindCapangasPanel(){
  const btn=document.getElementById('addCapangaBtn'); if(!btn) return;
  btn.onclick=()=>{
    const nome=document.getElementById('capangaNome').value.trim();
    if(!nome) return alert('Digite um nome para o grupo.');
    const vida=Math.max(0,Number(document.getElementById('capangaVida').value)||0);
    const energia=Math.max(0,Number(document.getElementById('capangaEnergia').value)||0);
    const quantidade=Math.max(1,Number(document.getElementById('capangaQuantidade').value)||1);
    state.capangas.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),nome,vida,energia,quantidade});
    saveMasterCapangas(); renderCapangasPanel();
    document.getElementById('capangaNome').value='';
  };
  renderCapangasPanel();
}

function updateResourceDisplays(){
  const t=totals();
  const maxes={ vida:computeVidaFinal(t), energia:computeEnergiaFinal(t), mental:computeMente(t) };
  ['vida','energia','mental'].forEach(key=>{
    const baseMax=maxes[key]; const extra=Number(state.recursos[key].extra)||0; const atual=Number(state.recursos[key].atual)||0;
    const chip=document.getElementById(`${key}MaxChip`);
    if (chip) chip.textContent = extra ? `${baseMax} (+${extra})` : `${baseMax}`;
    const totalCap=Math.max(1, baseMax+extra);
    const pct=Math.max(0, Math.min(100, (atual/totalCap)*100));
    const fill=document.getElementById(`${key}BarFill`);
    if (fill) fill.style.width=pct+'%';
  });
  updateIniciativaDisplay();
}

function exportBackup(){

async function importBackupFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    try {
      const loaded = JSON.parse(ev.target.result);

      // Um backup JSON representa uma nova cópia da ficha.
      // Não reutilizamos o ID/token da ficha que estava aberta.
      if(realtimeChannel && supabaseClient){
        try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){}
      }
      realtimeChannel = null;
      characterId = null;
      editToken = null;
      try{
        localStorage.removeItem('sonhos_ficha_id');
        localStorage.removeItem('sonhos_ficha_token');
      }catch(e){}

      state = mergeState(loaded);
      scheduleSave();

      if (state.wizardDone) {
        renderSheet();
        if(ONLINE_ENABLED && supabaseClient){
          try{
            await createOnlineCharacter();
            addOnlineControls();
          }catch(err){
            console.warn('Não foi possível criar a cópia online do backup:', err);
          }
        }
      } else {
        renderWizard();
      }
    } catch(err){
      alert('Não consegui ler esse arquivo. Confira se é um backup válido da ficha.');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

async function loadLobbyCharacters(){
  const {data: lobbyRows, error:lobbyError} = await supabaseClient
    .from('lobby_characters')
    .select('id,character_id,active,show_name,show_photo,show_health,show_energy,show_mental,public_data')
    .eq('active',true)
    .order('created_at',{ascending:true});
  if(lobbyError) throw lobbyError;

  const result=await Promise.all((lobbyRows||[]).map(async row=>{
    const pub=row.public_data||{};
    let fichaLobby={};
    try{
      const {data:fullState}=await supabaseClient.rpc('get_character_state',{p_id:row.character_id});
      fichaLobby=fullState?.lobby||{};
    }catch(e){}
    const privacy={...(pub.lobby||{}),...fichaLobby};
    return {
      id:row.character_id,
      public_data:pub,
      lobby:{
        mostrarNome:privacy.mostrarNome===true,
        mostrarFoto:privacy.mostrarFoto===true,
        mostrarVida:privacy.mostrarVida===true,
        mostrarEnergia:privacy.mostrarEnergia===true,
        mostrarMental:privacy.mostrarMental===true
      }
    };
  }));
  renderLobby(result);
}

function normalizeLobbyCapanga(c){
  const quantidade=Math.max(1,Number(c?.quantidade)||1);
  const vida=Math.max(0,Number(c?.vida)||0);
  const energia=Math.max(0,Number(c?.energia)||0);
  let membros=Array.isArray(c?.membros)?c.membros.map((m,i)=>({
    id:m.id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random())),
    nome:String(m.nome||`${c?.nome||'Capanga'} ${i+1}`),
    vida:Math.max(0,Number(m.vida ?? vida)||0),
    energia:Math.max(0,Number(m.energia ?? energia)||0)
  })) : [];
  while(membros.length<quantidade) membros.push({id:(crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()),nome:`${c?.nome||'Capanga'} ${membros.length+1}`,vida,energia});
  if(membros.length>quantidade) membros=membros.slice(0,quantidade);
  return {id:c?.id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random())),nome:String(c?.nome||'Capangas'),vida,energia,quantidade,membros,visivel:c?.visivel===true,mostrarNome:c?.mostrarNome===true,mostrarVida:c?.mostrarVida===true,mostrarEnergia:c?.mostrarEnergia===true};
}
function normalizeLobbyCapangas(groups){ return (Array.isArray(groups)?groups:[]).map(normalizeLobbyCapanga); }
function getLobbyCapangas(){
  try{return normalizeLobbyCapangas(JSON.parse(localStorage.getItem(CAPANGAS_STORAGE_KEY)||'[]'));}catch(e){return [];}
}
function saveLobbyCapangas(groups){
  const normalized=normalizeLobbyCapangas(groups);
  try{localStorage.setItem(CAPANGAS_STORAGE_KEY,JSON.stringify(normalized));}catch(e){}
  broadcastLobbyCapangas(normalized);
}
let lobbyCapangaChannel=null;
let lobbyCapangaReady=false;
function broadcastLobbyCapangas(groups){
  if(!LOBBY_ADMIN_TOKEN || !lobbyCapangaChannel || !lobbyCapangaReady) return;
  lobbyCapangaChannel.send({type:'broadcast',event:'capangas_state',payload:{groups:normalizeLobbyCapangas(groups)}}).catch(()=>{});
}
function buildLobbyCapangaMember(m,isAdmin,c){
  const nome = c.mostrarNome ? m.nome : '???';
  const vida = c.mostrarVida ? Number(m.vida)||0 : '???';
  const energia = c.mostrarEnergia ? Number(m.energia)||0 : '???';
  return `<div class="lobby-capanga-member">
    <div class="lobby-capanga-member-name">${escapeHtml(nome)}</div>
    ${isAdmin?`<label>❤️ <input type="number" min="0" value="${Number(m.vida)||0}" data-capanga-member-vida="${escapeHtml(m.id)}"></label><label>⚡ <input type="number" min="0" value="${Number(m.energia)||0}" data-capanga-member-energia="${escapeHtml(m.id)}"></label>`:`<div>❤️ <strong>${vida}</strong></div><div>⚡ <strong>${energia}</strong></div>`}
  </div>`;
}
function buildLobbyCapangaCard(c,isAdmin){
  const members=Array.isArray(c.membros)?c.membros:[];
  if(!isAdmin && c.visivel!==true) return '';
  return `<div class="lobby-capanga-card">
    <div class="lobby-capanga-title">⚔️ ${escapeHtml(c.mostrarNome ? (c.nome||'Capangas') : '???')} <span>(${members.length})</span></div>
    <div class="lobby-capanga-stats"><div>❤️ Vida base<strong>${c.mostrarVida ? Number(c.vida)||0 : '???'}</strong></div><div>⚡ Energia base<strong>${c.mostrarEnergia ? Number(c.energia)||0 : '???'}</strong></div><div>👥 Quantidade<strong>${members.length}</strong></div></div>
    ${isAdmin?`<div class="lobby-capanga-privacy"><label><input type="checkbox" ${c.visivel===true?'checked':''} data-toggle-capanga-visibility="${escapeHtml(c.id)}"> Mostrar grupo</label><label><input type="checkbox" ${c.mostrarNome===true?'checked':''} data-toggle-capanga-name="${escapeHtml(c.id)}"> Nome</label><label><input type="checkbox" ${c.mostrarVida===true?'checked':''} data-toggle-capanga-life="${escapeHtml(c.id)}"> Vida</label><label><input type="checkbox" ${c.mostrarEnergia===true?'checked':''} data-toggle-capanga-energy="${escapeHtml(c.id)}"> Energia</label></div>`:''}
    <details ${isAdmin?'open':''} class="lobby-capanga-details"><summary>${isAdmin?'Ver e editar indivíduos':'Ver indivíduos'}</summary><div class="lobby-capanga-members">${members.map(m=>buildLobbyCapangaMember(m,isAdmin,c)).join('')}</div></details>
    ${isAdmin?`<button type="button" class="lobby-capanga-remove" data-remove-lobby-capanga="${escapeHtml(c.id)}">Remover grupo</button>`:''}
  </div>`;
}
function renderLobbyCapangas(groupsOverride=null){
  const list=document.getElementById('lobbyCapangasList'); if(!list) return;
  const groups=normalizeLobbyCapangas(groupsOverride??getLobbyCapangas());
  const isAdmin=!!LOBBY_ADMIN_TOKEN;
  const cards=groups.map(c=>buildLobbyCapangaCard(c,isAdmin)).filter(Boolean).join('');
  list.innerHTML=cards||'<div class="empty-hint">Nenhum grupo de capangas disponível.</div>';
  if(isAdmin){
    list.querySelectorAll('[data-remove-lobby-capanga]').forEach(btn=>btn.onclick=()=>saveLobbyCapangas(groups.filter(c=>c.id!==btn.dataset.removeLobbyCapanga)));
    list.querySelectorAll('[data-toggle-capanga-visibility],[data-toggle-capanga-name],[data-toggle-capanga-life],[data-toggle-capanga-energy]').forEach(cb=>cb.onchange=()=>{
      const id=cb.dataset.toggleCapangaVisibility||cb.dataset.toggleCapangaName||cb.dataset.toggleCapangaLife||cb.dataset.toggleCapangaEnergy;
      const key=cb.dataset.toggleCapangaVisibility?'visivel':cb.dataset.toggleCapangaName?'mostrarNome':cb.dataset.toggleCapangaLife?'mostrarVida':'mostrarEnergia';
      const next=groups.map(c=>c.id===id?{...c,[key]:cb.checked}:c); saveLobbyCapangas(next); renderLobbyCapangas(next);
    });
    list.querySelectorAll('[data-capanga-member-vida],[data-capanga-member-energia]').forEach(inp=>inp.onchange=()=>{
      const id=inp.dataset.capangaMemberVida||inp.dataset.capangaMemberEnergia;
      const field=inp.dataset.capangaMemberVida?'vida':'energia';
      const next=groups.map(c=>({...c,membros:c.membros.map(m=>m.id===id?{...m,[field]:Math.max(0,Number(inp.value)||0)}:m)}));
      saveLobbyCapangas(next); renderLobbyCapangas(next);
    });
  }
}
function addLobbyCapanga(){
  if(!LOBBY_ADMIN_TOKEN) return;
  const nome=document.getElementById('lobbyCapangaNome')?.value.trim(); if(!nome) return alert('Digite um nome para o grupo.');
  const vida=Math.max(0,Number(document.getElementById('lobbyCapangaVida')?.value)||0);
  const energia=Math.max(0,Number(document.getElementById('lobbyCapangaEnergia')?.value)||0);
  const quantidade=Math.max(1,Number(document.getElementById('lobbyCapangaQuantidade')?.value)||1);
  const membros=Array.from({length:quantidade},(_,i)=>({id:(crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()),nome:`${nome} ${i+1}`,vida,energia}));
  saveLobbyCapangas([...getLobbyCapangas(),{id:(crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()),nome,vida,energia,quantidade,membros,visivel:false,mostrarNome:false,mostrarVida:false,mostrarEnergia:false}]);
  document.getElementById('lobbyCapangaNome').value=''; renderLobbyCapangas();
}
function subscribeLobbyCapangas(){
  if(lobbyCapangaChannel) supabaseClient.removeChannel(lobbyCapangaChannel);
  lobbyCapangaReady=false;
  lobbyCapangaChannel=supabaseClient.channel('sonhos-lobby-capangas');
  lobbyCapangaChannel.on('broadcast',{event:'capangas_state'},({payload})=>{
    const groups=normalizeLobbyCapangas(payload?.groups||[]);
    try{localStorage.setItem(CAPANGAS_STORAGE_KEY,JSON.stringify(groups));}catch(e){}
    renderLobbyCapangas(groups);
  });
  lobbyCapangaChannel.on('broadcast',{event:'capangas_request'},()=>{if(LOBBY_ADMIN_TOKEN) broadcastLobbyCapangas(getLobbyCapangas());});
  lobbyCapangaChannel.subscribe(status=>{
    if(status==='SUBSCRIBED'){
      lobbyCapangaReady=true;
      if(LOBBY_ADMIN_TOKEN) broadcastLobbyCapangas(getLobbyCapangas());
      else lobbyCapangaChannel.send({type:'broadcast',event:'capangas_request',payload:{}}).catch(()=>{});
    }
  });
}

function renderLobby(characters){
  const app=document.getElementById('app');
  const isAdmin=!!LOBBY_ADMIN_TOKEN;
  app.innerHTML=`
    <div class="app-shell">
      <div class="mini-logo">Sonhos do Alvorecer</div>

      <div class="lobby-header">
        <h1>Personagens em Cena</h1>
        <p>${isAdmin ? 'Modo mestre: adicione ou retire personagens conforme as cenas.' : 'Acompanhe os personagens que estão em cena nesta mesa.'}</p>
        ${isAdmin ? `
        <div class="lobby-add">
          <input type="text" id="lobbyLinkInput" placeholder="Cole aqui o link da ficha...">
          <button type="button" id="lobbyAddButton" class="btn btn-primary">Adicionar à cena</button>
        </div>` : ''}
      </div>

      <div class="lobby-capangas">
        <h2>⚔️ Capangas</h2>
        <p class="hint-text">${isAdmin ? 'Somente o mestre pode adicionar, editar, remover e decidir quais grupos os jogadores podem ver.' : 'Capangas liberados pelo mestre para os jogadores.'}</p>
        ${isAdmin?`<div class="lobby-capangas-form">
          <div class="field"><label>Grupo</label><input id="lobbyCapangaNome" type="text" placeholder="Ex.: Arqueiros"></div>
          <div class="field"><label>Vida</label><input id="lobbyCapangaVida" type="number" min="0" value="10"></div>
          <div class="field"><label>Energia</label><input id="lobbyCapangaEnergia" type="number" min="0" value="5"></div>
          <div class="field"><label>Quantidade</label><input id="lobbyCapangaQuantidade" type="number" min="1" value="1"></div>
          <button type="button" class="btn btn-primary" id="addLobbyCapangaBtn">Adicionar</button>
        </div>`:''}
        <div class="lobby-capangas-list" id="lobbyCapangasList"></div>
      </div>

      <div id="lobbyCharacters" class="lobby-grid">
        ${characters.length ? characters.map(buildLobbyCard).join('') : `<div class="lobby-empty">Nenhum personagem está em cena.</div>`}
      </div>
    </div>`;

  renderLobbyCapangas();
  if(isAdmin){
    document.getElementById('addLobbyCapangaBtn')?.addEventListener('click',addLobbyCapanga);
    document.getElementById('lobbyCapangaNome')?.addEventListener('keydown',e=>{if(e.key==='Enter') addLobbyCapanga();});
    document.getElementById('lobbyAddButton').addEventListener('click',addCharacterToLobby);
    document.getElementById('lobbyLinkInput').addEventListener('keydown',e=>{if(e.key==='Enter') addCharacterToLobby();});
    document.querySelectorAll('[data-remove-lobby]').forEach(btn=>btn.addEventListener('click',()=>removeCharacterFromLobby(btn.dataset.removeLobby)));
    document.querySelectorAll('[data-edit-lobby]').forEach(btn=>btn.addEventListener('click',()=>{ location.href=location.pathname+'?ficha='+encodeURIComponent(btn.dataset.editLobby)+'&master=1&admin='+encodeURIComponent(LOBBY_ADMIN_TOKEN); }));
  } else {
    document.querySelectorAll('[data-remove-lobby]').forEach(btn=>btn.remove());
  }
}
function getLobbyCharacterIdFromUrl(value){
  try{
    const u=new URL(value,location.href);
    const id=u.searchParams.get('ficha');
    return id && /^[0-9a-fA-F-]{36}$/.test(id) ? id : null;
  }catch(e){ return null; }
}

async function addCharacterToLobby(){
  if(!LOBBY_ADMIN_TOKEN){ alert('Somente o link de controle da mesa pode adicionar personagens.'); return; }
  const input=document.getElementById('lobbyLinkInput');
  const value=input.value.trim();
  const characterId=getLobbyCharacterIdFromUrl(value);
  if(!characterId){ alert('Esse link não parece ser um link válido de ficha.'); return; }

  const {data,error}=await supabaseClient.rpc('add_character_to_lobby',{p_character_id:characterId});
  if(error){ console.error(error); alert('Não consegui colocar a ficha no lobby. Verifique o link e o acesso de mestre.'); return; }
  input.value='';
  await loadLobbyCharacters();
}

async function removeCharacterFromLobby(characterId){
  if(!LOBBY_ADMIN_TOKEN) return;
  const {error}=await supabaseClient.rpc('remove_character_from_lobby',{p_character_id:characterId});
  if(error){ console.error(error); alert('Não consegui retirar a ficha do lobby.'); return; }
  await loadLobbyCharacters();
}

let lobbyRealtimeChannel=null;

function subscribeLobbyRealtime(){
  if(lobbyRealtimeChannel)
    supabaseClient.removeChannel(lobbyRealtimeChannel);

  lobbyRealtimeChannel=supabaseClient
    .channel('sonhos-lobby')
    .on(
      'postgres_changes',
      {
        event:'*',
        schema:'public',
        table:'lobby_characters'
      },
      ()=>loadLobbyCharacters()
    )
    .on(
      'postgres_changes',
      {
        event:'UPDATE',
        schema:'public',
        table:'characters'
      },
      ()=>loadLobbyCharacters()
    )
    .subscribe();
}

if(!window.__sonhosCapangasStorageBound){
  window.__sonhosCapangasStorageBound=true;
  window.addEventListener('storage',e=>{ if(e.key===CAPANGAS_STORAGE_KEY) renderLobbyCapangas(); });
}

async function initLobby(){
  if(!ONLINE_ENABLED){
    document.getElementById('app').innerHTML=
      '<div class="loading-screen">Supabase não configurado.</div>';
    return;
  }

  try{
    supabaseClient=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      LOBBY_ADMIN_TOKEN ? {global:{headers:{'x-lobby-admin-token':LOBBY_ADMIN_TOKEN}}} : undefined
    );

    await loadLobbyCharacters();
    subscribeLobbyRealtime();
    subscribeLobbyCapangas();
  }catch(e){
    console.error(e);

    document.getElementById('app').innerHTML=`
      <div class="loading-screen">
        Não foi possível carregar o lobby.
      </div>`;
  }
}
/* ===== Boot ===== */
async function init(){
  document.getElementById('app').innerHTML =
    '<div class="loading-screen">⚓ Erguendo velas...</div>';

  if(IS_LOBBY){
    await initLobby();
    return;
  }

  try{
    await loadState();
    if(IS_MASTER_SHEET){
      const masterCapangas=loadMasterCapangas();
      if(masterCapangas.length || !Array.isArray(state.capangas) || state.capangas.length===0) state.capangas=masterCapangas;
    }

    if(state.wizardDone){
      renderSheet();
    }else{
      renderWizard();
    }

    if(ONLINE_ENABLED && state.wizardDone && !characterId){
      try{
        await createOnlineCharacter();
      }catch(e){
        console.warn('Não foi possível criar a ficha online:',e);
      }
    }

    if(ONLINE_ENABLED) addOnlineControls();
  }catch(e){
    console.error('Erro ao abrir a ficha:',e);
    state = defaultState();
    renderWizard();
  }
}
function setSheetReadOnly(flag){
  readOnlySheet=flag;
  const root=document.getElementById('app');
  if(!root) return;
  root.classList.toggle('sheet-read-only',flag);
  root.querySelectorAll('input,textarea,select').forEach(el=>el.disabled=flag);
  root.querySelectorAll('button').forEach(btn=>{
    if(btn.classList.contains('tab-btn')) return;
    if(btn.id==='onlineShareBtn') return;
    btn.disabled=flag;
  });
}

function addOnlineControls(){
  if(document.getElementById('onlineShareBtn')) return;
  const b=document.createElement('button');
  b.id='onlineShareBtn'; b.type='button'; b.className='btn btn-ghost'; b.textContent='🔗 Compartilhar ficha';
  b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.35);';
  b.onclick=copyShareLink; document.body.appendChild(b);
}
document.addEventListener('DOMContentLoaded', init);
</script>
